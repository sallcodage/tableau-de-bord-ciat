# Déploiement en un clic sur Render (Blueprint) : New > Blueprint > choisir ce dépôt GitHub
databases:
  - name: ciat-db
    plan: free
    databaseName: ciat
    user: ciat

services:
  - type: web
    name: tableau-de-bord-ciat
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: ciat-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: GEMINI_API_KEY
        sync: false   # à saisir dans le tableau de bord Render
      - key: DEMO_PASSWORD
        sync: false
