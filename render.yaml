# Déploiement sur Render (Blueprint) — base PostgreSQL hébergée chez Neon
services:
  - type: web
    name: tableau-de-bord-ciat
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false   # connection string Neon, à saisir dans Render
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false